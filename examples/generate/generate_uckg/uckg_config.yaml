global_params:
  working_dir: cache
  graph_backend: kuzu
  kv_backend: rocksdb

nodes:
  - id: start_trigger
    op_name: read
    type: source
    dependencies: []
    params:
      input_path:
        - examples/generate/generate_uckg/dummy.txt

  - id: partition
    op_name: partition
    type: aggregate
    dependencies:
      - start_trigger
    params:
      method: leiden
      method_params:
        max_size: 50
        use_lcc: false
        random_seed: 42

  - id: generate
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 1
      batch_size: 1
    save_output: true
    params:
      method: atomic
      data_format: Sharegpt
